{% extends 'default.html' %}

{% block content %}
    <h1>Все новости</h1>
    <hr>
    {% if news %}
        {% for item in news %}
            <div>
                <!-- Ссылка на отдельную новость по её id -->
                <a href="{% url 'news_detail' item.id %}"><h3>{{ item.title }}</h3></a>
                <p>{{ item.creation_time_date|date:'d.m.Y' }}</p>
                <p>{{ item.preview }}</p>
            </div>
        {% endfor %}
    {% else %}
        <h2>Новостей нет!</h2>
    {% endif %}
{% endblock %}
